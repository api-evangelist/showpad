  /assets:
    get:
      operationId: getAssets
      summary: List all Assets
      description: |-
        Retrieve a list of assets available in your Showpad instance. Assets can include documents, videos, images, or other media files uploaded to the platform. This endpoint supports powerful filtering options by ID, name, tag, external identifiers, and more, enabling precise control over which assets are returned.

        Use this endpoint when you need to:
        - Build custom asset galleries or search interfaces
        - Integrate Showpad asset metadata into external systems
        - Filter assets by tag, name, or organizational Divisions for targeted access

        Supports pagination for large datasets and is ideal for asset syncing, reporting, or content discovery use cases.
      tags:
        - assets
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Defines the maximum number of items to return in the response. Useful for paginating results when fetching items in batches.
          example: limit=100
          schema:
            type: integer
            format: int32
            default: 50
            minimum: 0
            maximum: 1000
        - name: offset
          in: query
          description: Specifies the number of items to skip before returning results. Use in combination with `limit` to implement pagination when retrieving large datasets.
          required: false
          example: offset=0
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: divisionIds
          in: query
          description: Filters the results to include only assets that belong to one or more specific Divisions. This is useful for multi-Division organizations to retrieve content scoped to particular business units or regions.
          explode: false
          style: form
          example: 'division-id-1,division-id-2'
          schema:
            type: array
            items:
              type: string
        - name: ids
          in: query
          description: Returns only the assets with the specified Showpad asset IDs. This is helpful when you already have a list of asset IDs and need to fetch full details.
          explode: false
          style: form
          example: 'abc123,def456'
          schema:
            type: array
            items:
              type: string
        - name: name
          in: query
          description: Searches by full or partial name. Use this for free-text search or to narrow down results by known naming conventions.
          schema:
            type: string
            example: customer
        - name: externalIds
          in: query
          description: Filters assets by custom external identifiers. Use this if your system assigns unique IDs to assets outside of Showpad and you need to cross-reference them.
          explode: false
          style: form
          example: 'custom-id-1,custom-id-2'
          schema:
            type: array
            items:
              type: string
        - name: tagIds
          in: query
          description: 'Returns only assets that are tagged with all of the provided tag IDs. Use this to refine results based on tagging taxonomies such as product type, industry, or content category.'
          explode: false
          style: form
          example: 'tag-id-1,tag-id-2'
          schema:
            type: array
            items:
              type: string
        - name: slugs
          in: query
          description: 'Filters assets by their slugs, which are unique, human-readable identifiers often used in URLs or integrations. Use this when referring to assets via slug-based references.'
          explode: false
          style: form
          example: 'ea7134d3-1706-4a79-b808-617cb6b6d95c,245b9712-65d9-4bfc-8505-2d56939a8b6f'
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: OK. The request was successful. Returns a paginated list of assets matching the applied filters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    description: Total number of results matching the request criteria.
                    type: integer
                    format: int32
                    example: 20
                  items:
                    type: array
                    description: List of asset objects returned in the response.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier of the asset.
                          example: my-asset-id
                        currentFile:
                          type: object
                          nullable: true
                          properties:
                            id:
                              type: string
                              description: Unique identifier of the object.
                              example: my-asset-file-id
                        name:
                          type: string
                          description: Name of the asset.
                          example: my-asset.png
                        division:
                          description: Information about the Division the asset belongs to. Cannot be changed after creation.
                          type: object
                          properties:
                            id:
                              type: string
                              description: Unique identifier of the Division.
                              example: f541710283954a89bdfd40f221882451
                        status:
                          type: string
                          description: |
                            Current processing state of the asset:
                            * `prepared` - The asset is prepared and waiting for the binary file to be uploaded.
                            * `queued` - The asset is currently queued for processing.
                            * `processing` - The asset is currently being processed.
                            * `active` - The asset is done processing and can be used.
                            * `failed` - The asset encountered an error while processing.
                          enum:
                            - prepared
                            - queued
                            - processing
                            - active
                            - failed
                        type:
                          type: string
                          description: |
                            The type of the asset.
                          enum:
                            - 3d-model
                            - audio
                            - document
                            - page
                            - personal-video-recording
                            - photo
                            - raw
                            - scorm
                            - unknown
                            - url
                            - video
                            - webapp
                        slug:
                          type: string
                          description: URL-friendly identifier of the asset.
                        externalId:
                          type: string
                          description: A custom external reference ID for the asset. Only editable when the application owns the asset and the user has `manage_content` permissions for the Division.
                          nullable: true
                          example: my-custom-id
                          minLength: 1
                          maxLength: 128
                        description:
                          type: string
                          description: A description of the asset.
                          nullable: true
                        createdAt:
                          type: string
                          format: date-time
                          nullable: true
                          description: 'Timestamp when the asset was created, in `ISO 8601` UTC format.'
                        updatedAt:
                          type: string
                          format: date-time
                          nullable: true
                          description: 'Timestamp when the asset was last updated, in `ISO 8601` UTC format.'
                        expiresAt:
                          type: string
                          format: date-time
                          description: 'Optional expiration date of the asset, in `ISO 8601` UTC format.'
                          nullable: true
                        releasedAt:
                          type: string
                          format: date-time
                          description: 'Optional release date of the asset, in `ISO 8601` UTC format.'
                          nullable: true
                        draftedAt:
                          type: string
                          format: date-time
                          description: 'Optional draft date of the asset, in `ISO 8601` UTC format.'
                          nullable: true
                        lastUploadedAt:
                          type: string
                          format: date-time
                          description: 'Timestamp when the latest version of the asset was uploaded, in `ISO 8601` UTC format.'
                          nullable: true
                        permissions:
                          type: object
                          description: Defines the actions the current user is permitted to take on the asset.
                          properties:
                            isAnnotatable:
                              type: boolean
                              description: Indicates if the asset supports annotations (`true`) or not (`false`).
                            isEditable:
                              type: boolean
                              description: Indicates if the asset is editable (true) or not (false). This permission is applicable to `document` assets except PDFs.
                            isShareable:
                              type: boolean
                              description: Indicates if the asset can be shared (`true`) or not (`false`). Defaults to `true`.
                        isProcessedUsed:
                          type: boolean
                          description: Indicates if the optimized version (`true`) or the original file (`false`) is used when downloaded. Defaults to `true`.
                        isSpeakerNotesEnabled:
                          type: boolean
                          description: 'Indicates whether speaker notes are enabled for the asset (`true`) or not (`false`). When enabled, allows presenters to add and view speaker notes associated with the asset. Defaults to `false`.'
                        isDivisionShared:
                          type: boolean
                          description: |
                            Indicates whether the asset is shared across multiple Divisions (`true`) or restricted to its own Division (`false`). To enable cross-Division sharing, Division-level asset sharing must be enabled on the Division provided (`isAssetSharingEnabled`  set to true).
                        isSensitive:
                          type: boolean
                          description: 'If `true`, the asset is hidden in kiosk mode.'
                        isArchived:
                          type: boolean
                          description: 'If `true`, the asset has been archived and is no longer active.'
                        isRenderExternalAllowed:
                          type: boolean
                          description: |-
                            For `url` assets only. Indicates whether the URL should be opened:
                            - `true` – in a new tab (target="_blank")
                            - `false` – embedded in an iframe.
                        isOnlyEntireDocumentShareable:
                          type: boolean
                          description: Indicates whether individual pages of a document can be shared (`true`) or not (`false`). Defaults to `false`.
                        lockedPages:
                          type: array
                          description: Defines a range of pages that cannot be shared individually.
                          items:
                            type: object
                            required:
                              - start
                              - end
                            properties:
                              start:
                                type: integer
                                description: The first page in the range (inclusive).
                              end:
                                type: integer
                                description: The last page in the range (inclusive).
                        enforcedPages:
                          type: object
                          description: Pages that are enforced to be prepended or appended when sharing.
                          nullable: true
                          properties:
                            prepend:
                              type: array
                              nullable: true
                              items:
                                type: object
                                required:
                                  - start
                                  - end
                                properties:
                                  start:
                                    type: integer
                                    description: The first page in the range (inclusive).
                                  end:
                                    type: integer
                                    description: The last page in the range (inclusive).
                            append:
                              type: array
                              nullable: true
                              items:
                                type: object
                                required:
                                  - start
                                  - end
                                properties:
                                  start:
                                    type: integer
                                    description: The first page in the range (inclusive).
                                  end:
                                    type: integer
                                    description: The last page in the range (inclusive).
                        duration:
                          type: integer
                          description: The duration in seconds of the video/audio file.
                          nullable: true
                          readOnly: true
                        pageCount:
                          type: integer
                          description: Total number of pages in the document. Applicable to `document` assets only.
                          nullable: true
                        wordCount:
                          type: integer
                          format: int64
                          description: The number of words in the content.
                          example: 100
                          nullable: true
                          readOnly: true
                        competencies:
                          type: array
                          description: List of competency UUIDs associated with this asset.
                          readOnly: true
                          items:
                            type: string
                            pattern: '^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$'
                            example: a3e72bbf-ae0b-8738-1106-b1beb685ea88
                        url:
                          type: string
                          description: For `url` assets only. The external URL the asset points to.
                          nullable: true
                        checksum:
                          type: string
                          description: 'MD5 hash of the uploaded file, used to verify data integrity.'
                          nullable: true
                        size:
                          type: integer
                          description: 'Size of the uploaded asset file, in bytes.'
                          nullable: true
                        tags:
                          type: array
                          description: List of tags assigned to the asset. Only the `id` is returned.
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: Unique identifier of the tag.
                                example: df391e1da6ed4db8a8085838f7abd130
                        countries:
                          type: array
                          description: List of countries assigned to the asset.
                          items:
                            description: using `ISO 3166-1 alpha-2` country code
                            type: object
                            properties:
                              code:
                                type: string
                                format: iso-3166
                                description: The `ISO 3166-1 alpha-2` country code identifying the supported country.
                                example: US
                        languages:
                          type: array
                          description: List of languages assigned to the asset.
                          items:
                            description: The `ISO 639-1` language code identifying the supported language.
                            type: object
                            properties:
                              code:
                                type: string
                                description: '`BCP 47` language tag.'
                                example: en
                        authors:
                          type: array
                          description: List of assigned content authors.
                          items:
                            type: object
                            properties:
                              id:
                                description: User ID of the content author.
                                type: string
                                example: 83a5a807b3c487c91f39d1c3da00b5d6
                        downloadableExternal:
                          type: array
                          description: |
                            List of asset versions available for external download. An empty array means the asset is not downloadable externally.
                          items:
                            type: string
                            enum:
                              - original
                              - pdf
                            description: |
                              Types of downloads that are possible:
                              * `original` - The original file can be downloaded
                              * `pdf` - The generated PDF version can be downloaded
                        downloadableInternal:
                          type: array
                          description: |
                            List of asset versions available for download by authenticated users. An empty array means the asset is not downloadable internally.
                          items:
                            type: string
                            enum:
                              - original
                              - pdf
                            description: |
                              Types of downloads that are possible:
                              * `original` - The original file can be downloaded
                              * `pdf` - The generated PDF version can be downloaded
                        localization:
                          type: object
                          nullable: true
                          description: Details about localized versions of the asset. Null if not applicable.
                          required:
                            - primary
                            - variants
                          properties:
                            primary:
                              type: object
                              description: The primary asset of the localization configuration.
                              properties:
                                asset:
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                      description: Unique identifier of the asset.
                                      example: my-asset-id
                            variants:
                              type: array
                              description: List of variants associated with the primary asset.
                              minItems: 0
                              maxItems: 50
                              items:
                                type: object
                                required:
                                  - asset
                                  - status
                                properties:
                                  asset:
                                    type: object
                                    required:
                                      - id
                                      - languages
                                      - countries
                                      - authors
                                    properties:
                                      id:
                                        type: string
                                        description: Unique identifier of the asset.
                                        example: my-asset-id
                                      languages:
                                        type: array
                                        description: List of assigned languages.
                                        items:
                                          description: The `ISO 639-1` language code identifying the supported language.
                                          type: object
                                          properties:
                                            code:
                                              type: string
                                              description: '`BCP 47` language tag.'
                                              example: en
                                      countries:
                                        type: array
                                        description: List of assigned countries.
                                        items:
                                          description: using `ISO 3166-1 alpha-2` country code
                                          type: object
                                          properties:
                                            code:
                                              type: string
                                              format: iso-3166
                                              description: The `ISO 3166-1 alpha-2` country code identifying the supported country.
                                              example: US
                                      authors:
                                        type: array
                                        description: List of assigned content authors.
                                        items:
                                          type: object
                                          properties:
                                            id:
                                              description: User ID of the content author.
                                              type: string
                                              example: 83a5a807b3c487c91f39d1c3da00b5d6
                                  status:
                                    type: string
                                    description: |
                                      Current status of the variant:
                                      * `to-be-localized` - The variant refers to the binary file of the primary asset; it must be localized.
                                      * `outdated` - The variant is explicitly marked as outdated by a Showpad user.
                                      * `localized` - The variant is a localized variant with its own binary file.
                                    enum:
                                      - to-be-localized
                                      - outdated
                                      - localized
        '401':
          description: 'Unauthorized. The request lacks valid authentication credentials, or the provided token has expired.'
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - title
                  - detail
                  - status
                properties:
                  title:
                    type: string
                    description: |
                      A short summary of the error type. This is intended for engineers and technical users. It is always in English and not localized.
                    example: Invalid Payload
                  detail:
                    type: string
                    description: |
                      A human-readable explanation of the specific reason for the failure.
                    example: Property value provided is not valid.
                  status:
                    type: integer
                    format: int32
                    description: |
                      The HTTP status code returned by the server.
                    minimum: 400
                    maximum: 599
                    example: 400
                  meta:
                    type: array
                    nullable: true
                    description: Additional metadata entries providing field-level context about the error. Null if not applicable.
                    items:
                      type: object
                      description: Additional metadata entries providing field-level context about the error.
                      required:
                        - name
                        - reason
                        - category
                      properties:
                        name:
                          type: string
                          example: color
                          description: 'The name of the field or parameter associated with the error, if applicable.'
                        reason:
                          type: string
                          example: 'Value must be ''green'', ''red'' or ''blue''.'
                          description: A descriptive message explaining what is wrong with the field or parameter.
                        category:
                          type: string
                          example: propertyRequired
                          description: 'Classification of the error, useful for programmatic handling.'
                  type:
                    type: string
                    nullable: true
                    description: 'URI reference to a resource that defines the error type, if available. Null if not applicable.'
        '403':
          description: Forbidden. The server understood the request but refuses to authorize it. The authenticated user does not have the necessary permissions to perform this action.
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - title
                  - detail
                  - status
                properties:
                  title:
                    type: string
                    description: |
                      A short summary of the error type. This is intended for engineers and technical users. It is always in English and not localized.
                    example: Invalid Payload
                  detail:
                    type: string
                    description: |
                      A human-readable explanation of the specific reason for the failure.
                    example: Property value provided is not valid.
                  status:
                    type: integer
                    format: int32
                    description: |
                      The HTTP status code returned by the server.
                    minimum: 400
                    maximum: 599
                    example: 400
                  meta:
                    type: array
                    nullable: true
                    description: Additional metadata entries providing field-level context about the error. Null if not applicable.
                    items:
                      type: object
                      description: Additional metadata entries providing field-level context about the error.
                      required:
                        - name
                        - reason
                        - category
                      properties:
                        name:
                          type: string
                          example: color
                          description: 'The name of the field or parameter associated with the error, if applicable.'
                        reason:
                          type: string
                          example: 'Value must be ''green'', ''red'' or ''blue''.'
                          description: A descriptive message explaining what is wrong with the field or parameter.
                        category:
                          type: string
                          example: propertyRequired
                          description: 'Classification of the error, useful for programmatic handling.'
                  type:
                    type: string
                    nullable: true
                    description: 'URI reference to a resource that defines the error type, if available. Null if not applicable.'
    post:
      operationId: postAssets
      summary: Create an asset
      description: |-
        This endpoint creates a new asset record in Showpad. An asset represents a digital resource such as a document, image, video, or URL. Creating an asset involves providing its metadata, assigning it to a Division, and optionally setting additional properties such as tags, countries, languages, authors, sharing permissions, and expiration details.

        Note: The asset file (binary content) is not uploaded through this endpoint. Once the asset has been created successfully, you must upload the file by creating an asset file (see [Create an asset file](https://developer.showpad.com/docs/apis/references/v4#/operations/postAssetFiles)).

        Assets can be created as either:
        - Local assets — Files that are stored and managed directly in Showpad.
        - External assets — Assets managed by external OAuth2 clients.

        The request requires authentication and appropriate content management permissions for the specified Division.
      tags:
        - assets
      security:
        - BearerAuth: []
      requestBody:
        description: |
          The request payload to create a new asset.
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - division
              properties:
                name:
                  type: string
                  description: The name of the asset.
                  example: My Document.pdf
                division:
                  type: object
                  allOf:
                    - type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier of the Division.
                          example: f541710283954a89bdfd40f221882451
                  description: The Division the asset belongs to. Cannot be changed after creation.
                externalId:
                  type: string
                  description: A custom external reference ID for the asset. Only editable when the application owns the asset and the user has `manage_content` permissions for the Division.
                  nullable: true
                  example: my-custom-id
                  minLength: 1
                  maxLength: 128
                description:
                  type: string
                  description: A description of the asset.
                  nullable: true
                permissions:
                  type: object
                  description: Defines the user actions that are permitted for this asset.
                  properties:
                    isAnnotatable:
                      type: boolean
                      default: true
                      description: Indicates if the asset supports annotations (`true`) or not (`false`).
                    isEditable:
                      type: boolean
                      description: Indicates if the asset is editable (true) or not (false). This permission is applicable to `document` assets except PDFs.
                    isShareable:
                      type: boolean
                      default: true
                      description: Indicates if the asset can be shared (`true`) or not (`false`).
                isProcessedUsed:
                  type: boolean
                  description: Indicates if the optimized version (`true`) or the original file (`false`) is used when downloaded. Defaults to `true`.
                isDivisionShared:
                  type: boolean
                  default: false
                  description: |
                    Indicates whether the asset is shared across multiple Divisions (`true`) or restricted to its own Division (`false`). To enable cross-Division sharing, Division-level asset sharing must be enabled on the Division provided (`isAssetSharingEnabled`  set to true).
                enforcedPages:
                  type: object
                  description: Pages that are enforced to be prepended or appended when sharing.
                  nullable: true
                  properties:
                    prepend:
                      type: array
                      nullable: true
                      items:
                        type: object
                        required:
                          - start
                          - end
                        properties:
                          start:
                            type: integer
                            description: The first page in the range (inclusive).
                          end:
                            type: integer
                            description: The last page in the range (inclusive).
                    append:
                      type: array
                      nullable: true
                      items:
                        type: object
                        required:
                          - start
                          - end
                        properties:
                          start:
                            type: integer
                            description: The first page in the range (inclusive).
                          end:
                            type: integer
                            description: The last page in the range (inclusive).
                isSensitive:
                  type: boolean
                  default: false
                  description: |
                    If `true`, the asset is hidden in kiosk mode.
                isArchived:
                  type: boolean
                  default: false
                  nullable: true
                  description: 'If `true`, the asset has been archived and is no longer active.'
                isRenderExternalAllowed:
                  type: boolean
                  description: |-
                    For URL assets only. Indicates whether the URL should be opened:
                    - `true`: in a new tab (target="_blank").
                    - `false`: embedded in an iframe.
                isOnlyEntireDocumentShareable:
                  type: boolean
                  description: Indicates whether individual pages of a document can be shared (`true`) or not (`false`). Defaults to `false`.
                isSpeakerNotesEnabled:
                  type: boolean
                  description: 'Indicates whether speaker notes are enabled for the asset (`true`) or not (`false`). When enabled, allows presenters to add and view speaker notes associated with the asset. Defaults to `false`.'
                lockedPages:
                  type: array
                  description: Defines a range of pages that cannot be shared individually.
                  items:
                    type: object
                    required:
                      - start
                      - end
                    properties:
                      start:
                        type: integer
                        description: The first page in the range (inclusive).
                      end:
                        type: integer
                        description: The last page in the range (inclusive).
                expiresAt:
                  type: string
                  format: date-time
                  nullable: true
                  description: 'Optional expiration date of the asset, in `ISO 8601` UTC format.'
                releasedAt:
                  type: string
                  format: date-time
                  description: 'Optional release date of the asset, in `ISO 8601` UTC format.'
                  nullable: true
                draftedAt:
                  type: string
                  format: date-time
                  description: 'Optional draft date of the asset, in `ISO 8601` UTC format.'
                  nullable: true
                url:
                  type: string
                  description: Only for URL-based assets. The target URL.
                  nullable: true
                tags:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Unique identifier of the tag.
                        example: df391e1da6ed4db8a8085838f7abd130
                  description: List of tags assigned to the asset.
                languages:
                  type: array
                  items:
                    description: The `ISO 639-1` language code identifying the supported language.
                    type: object
                    properties:
                      code:
                        type: string
                        description: '`BCP 47` language tag.'
                        example: en
                  description: List of assigned languages.
                countries:
                  type: array
                  description: List of assigned countries.
                  items:
                    description: using `ISO 3166-1 alpha-2` country code
                    type: object
                    properties:
                      code:
                        type: string
                        format: iso-3166
                        description: The `ISO 3166-1 alpha-2` country code identifying the supported country.
                        example: US
                authors:
                  type: array
                  description: List of assigned content authors.
                  items:
                    type: object
                    properties:
                      id:
                        description: User ID of the content author.
                        type: string
                        example: 83a5a807b3c487c91f39d1c3da00b5d6
                downloadableExternal:
                  type: array
                  items:
                    type: string
                    enum:
                      - original
                      - pdf
                    description: |
                      Types of downloads that are possible:
                      * `original` - The original file can be downloaded
                      * `pdf` - The generated PDF version can be downloaded
                  description: |
                    List of asset versions available for external download. An empty array means the asset is not downloadable externally.
                downloadableInternal:
                  type: array
                  items:
                    type: string
                    enum:
                      - original
                      - pdf
                    description: |
                      Types of downloads that are possible:
                      * `original` - The original file can be downloaded
                      * `pdf` - The generated PDF version can be downloaded
                  description: |
                    List of asset versions available for download by authenticated users. An empty array means the asset is not downloadable internally.
                origin:
                  type: object
                  description: |-
                    Defines the source of the asset, determining whether it is managed locally within Showpad or externally by an OAuth2 client.
                    - Local asset: Either omit the origin object entirely, or provide an origin object with type set to `local` and id set to `showpad`.
                    - External asset: Provide an origin object with type set to `oauth2client`, linking the asset to the external OAuth2 client associated with the authenticated user.
                    Any other combination of values will result in a 400 Bad Request error.
                  properties:
                    id:
                      type: string
                      enum:
                        - showpad
                      description: |
                        Required for local assets with `id` set to `showpad`.
                    type:
                      type: string
                      enum:
                        - local
                        - oauth2client
                      description: |-
                        Asset origin type.
                        - Local asset: `type` must be set to `local` and `id` set to `showpad`.
                        - External asset: `type` must be set to `oauth2client`. This links the asset to the external OAuth2 client associated with the authenticated user.
                  required:
                    - type
                  example: |
                    {
                      "type": "oauth2client"
                    }
            examples:
              Microsoft Word document (docx):
                summary: A Division-shared Microsoft Word (docx) asset
                description: |
                  This example creates a Microsoft Word (docx) asset. The `isDivisionShared` property is used to indicate that this asset is shared across Divisions. The permissions are set to allow annotations, editing and sharing of the asset.
                value: |
                  {
                    "name": "My Document.docx",
                    "division": {
                      "id": "26092c300714ba38ecc245b0da65daef"
                    },
                    "isDivisionShared": true,
                    "permissions": {
                      "isAnnotatable": true,
                      "isEditable": true,
                      "isShareable": true
                    }
                  }
              PDF document:
                summary: 'A PDF asset with tags, languages, countries and authors.'
                description: |
                  This example creates a PDF (document) asset in a Division. A tag is set on the asset as well as other metadata like languages, countries and authors. The permissions to share and annotate the asset have been allowed. Note that the `isEditable` permission is not applicable to PDF assets and providing this will result in a 400 (`Bad request`) response.
                value: |
                  {
                    "name": "My Document.pdf",
                    "division": {
                      "id": "f541710283954a89bdfd40f221882451"
                    },
                    "description": "the asset description",
                    "tags": [
                      {
                        "id": "df391e1da6ed4db8a8085838f7abd130"
                      }
                    ],
                    "permissions": {
                      "isAnnotatable": true,
                      "isShareable": true
                    },
                    "languages": [
                      {
                        "code": "en"
                      }
                    ],
                    "countries": [
                      {
                        "code": "US"
                      }
                    ],
                    "authors": [
                      {
                        "id": "83a5a807b3c487c91f39d1c3da00b5d6"
                      }
                    ]
                  }
              Photo asset (png):
                summary: A photo (png) asset
                description: |
                  This example creates a photo (png) asset. The asset is not allowed to be shared.
                value: |
                  {
                    "name": "My Photo.png",
                    "division": {
                      "id": "26092c300714ba38ecc245b0da65daef"
                    },
                    "permissions": {
                      "isShareable": false
                    }
                  }
              URL asset:
                summary: A URL asset
                description: |
                  This example creates a URL (hyperlink) asset in a Division. Note that the name needs to have a `.url` extension.
                  The `url` field must be used to provide the location.
                value: |
                  {
                    "name": "Showpad.url",
                    "division": {
                      "id": "26092c300714ba38ecc245b0da65daef"
                    },
                    "url": "https://www.showpad.com"
                  }
              Video asset linked to the integration:
                summary: A video asset linked to your integration
                description: |
                  This example creates an video (mp4) asset. This asset is linked to the integration.
                  The `externalId` is optional but can be provided to maintain a reference to another system.
                value: |
                  {
                    "name": "how-to-use-showpad.mp4",
                    "division": {
                      "id": "26092c300714ba38ecc245b0da65daef"
                    },
                    "origin": {
                      "type": "oauth2client"
                    },
                    "externalId": "abc-123"
                  }
      responses:
        '201':
          description: Created. The asset record was successfully created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Unique identifier of the asset.
                    example: my-asset-id
                  currentFile:
                    type: object
                    nullable: true
                    properties:
                      id:
                        type: string
                        description: Unique identifier of the object.
                        example: my-asset-file-id
                  name:
                    type: string
                    description: Name of the asset.
                    example: my-asset.png
                  division:
                    description: Information about the Division the asset belongs to. Cannot be changed after creation.
                    type: object
                    properties:
                      id:
                        type: string
                        description: Unique identifier of the Division.
                        example: f541710283954a89bdfd40f221882451
                  status:
                    type: string
                    description: |
                      Current processing state of the asset:
                      * `prepared` - The asset is prepared and waiting for the binary file to be uploaded.
                      * `queued` - The asset is currently queued for processing.
                      * `processing` - The asset is currently being processed.
                      * `active` - The asset is done processing and can be used.
                      * `failed` - The asset encountered an error while processing.
                    enum:
                      - prepared
                      - queued
                      - processing
                      - active
                      - failed
                  type:
                    type: string
                    description: |
                      The type of the asset.
                    enum:
                      - 3d-model
                      - audio
                      - document
                      - page
                      - personal-video-recording
                      - photo
                      - raw
                      - scorm
                      - unknown
                      - url
                      - video
                      - webapp
                  slug:
                    type: string
                    description: URL-friendly identifier of the asset.
                  externalId:
                    type: string
                    description: A custom external reference ID for the asset. Only editable when the application owns the asset and the user has `manage_content` permissions for the Division.
                    nullable: true
                    example: my-custom-id
                    minLength: 1
                    maxLength: 128
                  description:
                    type: string
                    description: A description of the asset.
                    nullable: true
                  createdAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: 'Timestamp when the asset was created, in `ISO 8601` UTC format.'
                  updatedAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: 'Timestamp when the asset was last updated, in `ISO 8601` UTC format.'
                  expiresAt:
                    type: string
                    format: date-time
                    description: 'Optional expiration date of the asset, in `ISO 8601` UTC format.'
                    nullable: true
                  releasedAt:
                    type: string
                    format: date-time
                    description: 'Optional release date of the asset, in `ISO 8601` UTC format.'
                    nullable: true
                  draftedAt:
                    type: string
                    format: date-time
                    description: 'Optional draft date of the asset, in `ISO 8601` UTC format.'
                    nullable: true
                  lastUploadedAt:
                    type: string
                    format: date-time
                    description: 'Timestamp when the latest version of the asset was uploaded, in `ISO 8601` UTC format.'
                    nullable: true
                  permissions:
                    type: object
                    description: Defines the actions the current user is permitted to take on the asset.
                    properties:
                      isAnnotatable:
                        type: boolean
                        description: Indicates if the asset supports annotations (`true`) or not (`false`).
                      isEditable:
                        type: boolean
                        description: Indicates if the asset is editable (true) or not (false). This permission is applicable to `document` assets except PDFs.
                      isShareable:
                        type: boolean
                        description: Indicates if the asset can be shared (`true`) or not (`false`). Defaults to `true`.
                  isProcessedUsed:
                    type: boolean
                    description: Indicates if the optimized version (`true`) or the original file (`false`) is used when downloaded. Defaults to `true`.
                  isSpeakerNotesEnabled:
                    type: boolean
                    description: 'Indicates whether speaker notes are enabled for the asset (`true`) or not (`false`). When enabled, allows presenters to add and view speaker notes associated with the asset. Defaults to `false`.'
                  isDivisionShared:
                    type: boolean
                    description: |
                      Indicates whether the asset is shared across multiple Divisions (`true`) or restricted to its own Division (`false`). To enable cross-Division sharing, Division-level asset sharing must be enabled on the Division provided (`isAssetSharingEnabled`  set to true).
                  isSensitive:
                    type: boolean
                    description: 'If `true`, the asset is hidden in kiosk mode.'
                  isArchived:
                    type: boolean
                    description: 'If `true`, the asset has been archived and is no longer active.'
                  isRenderExternalAllowed:
                    type: boolean
                    description: |-
                      For `url` assets only. Indicates whether the URL should be opened:
                      - `true` – in a new tab (target="_blank")
                      - `false` – embedded in an iframe.
                  isOnlyEntireDocumentShareable:
                    type: boolean
                    description: Indicates whether individual pages of a document can be shared (`true`) or not (`false`). Defaults to `false`.
                  lockedPages:
                    type: array
                    description: Defines a range of pages that cannot be shared individually.
                    items:
                      type: object
                      required:
                        - start
                        - end
                      properties:
                        start:
                          type: integer
