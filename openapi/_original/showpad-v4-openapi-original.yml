      description: |-
        Use this endpoint to create a new recommendation rule within a CRM instance. Recommendation rules define how content is suggested to users based on CRM data and tag configurations.

        Use this endpoint when you need to:
        - Add a new rule that links CRM fields to asset tags
        - Automate content recommendations based on CRM conditions or values
        - Manage dynamic associations between CRM data and assets

