                        description: The hex code configuration for text overlay elements placed on top of accent-colored components. Do not include a leading hashtag (#).
                  createdAt:
                    type: string
                    format: date-time
                    description: The date and time when the theme was created.
                    example: '2019-08-24T14:15:22Z'
                  updatedAt:
                    type: string
                    format: date-time
                    description: The date and time when the theme was last modified.
                    example: '2019-08-24T14:15:22Z'
                  division:
                    type:
                      - object
                      - 'null'
