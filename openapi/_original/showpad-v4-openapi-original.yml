                        description: The ID of the Shared Space Extension
                        example: 01XXXXX4XXXXXCCXXXX6XXXXXXPK
                      name:
                        type: string
                        description: Name of the Shared Space Extension
                        example: Shared Space Meetings
                      description:
                        type: string
