  /shares:
    post:
      operationId: create-share
      summary: Create a Share
      description: "Create a new Share to distribute one or more assets with external recipients via a downloadable or view-only link. \nShares can be customized with a title, expiration date, download permissions, and a visual theme.\n\nThis endpoint supports setting Share-level metadata, targeting specific asset pages, and restricting access to \nprotect sensitive content.\n\nUse this endpoint when you need to:\n\n* Share documents, media, or Collections with external users\n* Customize the look and feel of the Share\n* Control asset availability through download restrictions or expiration settings\n"
      tags:
        - shares
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 200
                  example: Customer X – Q3 Sales Material
                  description: |-
                    A descriptive title for the Share, visible to recipients and used to identify the shared content.
                            This title appears on the Shares tab in the Web App and in notification emails.
                assets:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 9c5f3aa0784df25db1db821354e337e9
                        description: The unique identifier of the asset to share.
                      page:
                        type: integer
                        exclusiveMinimum: 0
                        example: 1
                        description: |
                          Optional. The 1-based page number to open when the asset is viewed.
                          Ignored for non-paginated assets like image assets.
                    required:
                      - id
                  maxItems: 300
                  example:
                    - id: 9c5f3aa0784df25db1db821354e337e9
                      page: 1
                    - id: 9c5f3aa0784df25db1db821354e337e9
                  description: 'A list of assets to include in the Share, with a maximum of `300` items. Each asset must include an id, and can optionally specify a `page` number to open by default.'
                origin:
                  type: string
                  maxLength: 20
                  example: Showpad Web-app
