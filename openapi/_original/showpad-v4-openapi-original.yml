                                    description: List of assigned languages.
                                  countries:
                                    type: array
                                    description: List of assigned countries.
                                    items:
                                      description: using `ISO 3166-1 alpha-2` country code
                                      type: object
                                      properties:
                                        code:
                                          type: string
                                          format: iso-3166
                                          description: The `ISO 3166-1 alpha-2` country code identifying the supported country.
                                          example: US
                                  authors:
                                    type: array
                                    description: List of assigned content authors.
                                    items:
                                      type: object
                                      properties:
                                        id:
                                          description: User ID of the content author.
                                          type: string
                                          example: 83a5a807b3c487c91f39d1c3da00b5d6
                                required:
                                  - id
                          - type: object
                            description: 'Representation of a placeholder asset, containing the same properties as the primary asset, combined with the specified languages, countries and authors.'
                            properties:
                              asset:
                                type: object
                                properties:
                                  languages:
                                    type: array
                                    items:
                                      description: The `ISO 639-1` language code identifying the supported language.
                                      type: object
                                      properties:
                                        code:
                                          type: string
                                          description: '`BCP 47` language tag.'
                                          example: en
                                    description: List of assigned languages.
                                  countries:
                                    type: array
                                    description: List of assigned countries.
                                    items:
                                      description: using `ISO 3166-1 alpha-2` country code
                                      type: object
                                      properties:
                                        code:
                                          type: string
                                          format: iso-3166
                                          description: The `ISO 3166-1 alpha-2` country code identifying the supported country.
                                          example: US
                                  authors:
                                    type: array
                                    description: List of assigned content authors.
                                    items:
                                      type: object
                                      properties:
                                        id:
                                          description: User ID of the content author.
                                          type: string
                                          example: 83a5a807b3c487c91f39d1c3da00b5d6
                                required:
