  '/shared-spaces/{shareId}/items':
    post:
      operationId: shared-spaces-items-add
      summary: Add items to Shared Space
      description: |-
        Add items to Shared Space.
        You can add individual files and create folders on-the-fly.
        Supports nested structures with folders containing other items.
      tags:
        - shared-spaces
      security:
        - BearerAuth: []
      parameters:
        - schema:
            type: string
          required: true
          name: shareId
          in: path
          description: ID of the Shared Space
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    oneOf:
                      - type: object
                        properties:
                          type:
                            type: string
                            enum:
                              - asset
                          assetId:
                            type: string
                            description: The unique identifier of the asset to add.
                          page:
                            type: integer
                            exclusiveMinimum: 0
                            example: 1
                            description: 'The page number of the asset, this is 1-based'
                        required:
                          - type
                          - assetId
                        title: AssetItem
                      - type: object
                        properties:
                          type:
                            type: string
                            enum:
                              - folder
                          name:
                            type: string
                            example: Price Lists
                            description: The name of the folder
                          description:
                            type: string
                            description: The description of the folder
                          folderItems:
                            type: array
                            items:
                              oneOf:
                                - type: object
                                  properties:
                                    type:
                                      type: string
                                      enum:
