  '/assets/{assetId}':
    parameters:
      - name: assetId
        in: path
        required: true
        description: The asset ID.
        schema:
          type: string
          example: ab4756bbdeytifj334tppqef
    get:
      operationId: getAsset
      summary: Retrieve an Asset
      description: |-
        Retrieves a single asset by its unique ID. This is helpful when you need to inspect or work with a specific piece of content and require its full details.

        Use this endpoint when you need to:
        - Fetch all available details for a specific asset
        - Display or preview asset content in an application
        - Retrieve metadata, tags, file info, and processing status
        - Check localization or download options for a given asset
        - Confirm the current state of an asset before performing an update or action.
      tags:
        - assets
      security:
        - BearerAuth: []
      responses:
        '200':
          description: OK. The request was successful. Returns the requested asset object.
          x-summary: OK. Request is successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Unique identifier of the asset.
                    example: my-asset-id
                  currentFile:
                    type: object
                    nullable: true
                    properties:
                      id:
                        type: string
                        description: Unique identifier of the object.
                        example: my-asset-file-id
                  name:
                    type: string
                    description: Name of the asset.
                    example: my-asset.png
                  division:
                    description: Information about the Division the asset belongs to. Cannot be changed after creation.
                    type: object
                    properties:
                      id:
                        type: string
                        description: Unique identifier of the Division.
                        example: f541710283954a89bdfd40f221882451
                  status:
                    type: string
                    description: |
                      Current processing state of the asset:
                      * `prepared` - The asset is prepared and waiting for the binary file to be uploaded.
                      * `queued` - The asset is currently queued for processing.
                      * `processing` - The asset is currently being processed.
                      * `active` - The asset is done processing and can be used.
                      * `failed` - The asset encountered an error while processing.
                    enum:
                      - prepared
                      - queued
                      - processing
                      - active
                      - failed
                  type:
                    type: string
                    description: |
                      The type of the asset.
                    enum:
                      - 3d-model
                      - audio
                      - document
                      - page
                      - personal-video-recording
                      - photo
                      - raw
                      - scorm
                      - unknown
                      - url
                      - video
                      - webapp
                  slug:
                    type: string
                    description: URL-friendly identifier of the asset.
                  externalId:
                    type: string
                    description: A custom external reference ID for the asset. Only editable when the application owns the asset and the user has `manage_content` permissions for the Division.
                    nullable: true
                    example: my-custom-id
                    minLength: 1
                    maxLength: 128
                  description:
                    type: string
                    description: A description of the asset.
                    nullable: true
                  createdAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: 'Timestamp when the asset was created, in `ISO 8601` UTC format.'
                  updatedAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: 'Timestamp when the asset was last updated, in `ISO 8601` UTC format.'
                  expiresAt:
                    type: string
                    format: date-time
                    description: 'Optional expiration date of the asset, in `ISO 8601` UTC format.'
                    nullable: true
                  releasedAt:
                    type: string
                    format: date-time
                    description: 'Optional release date of the asset, in `ISO 8601` UTC format.'
                    nullable: true
                  draftedAt:
                    type: string
                    format: date-time
                    description: 'Optional draft date of the asset, in `ISO 8601` UTC format.'
                    nullable: true
                  lastUploadedAt:
                    type: string
                    format: date-time
                    description: 'Timestamp when the latest version of the asset was uploaded, in `ISO 8601` UTC format.'
                    nullable: true
                  permissions:
                    type: object
                    description: Defines the actions the current user is permitted to take on the asset.
                    properties:
                      isAnnotatable:
                        type: boolean
                        description: Indicates if the asset supports annotations (`true`) or not (`false`).
                      isEditable:
                        type: boolean
                        description: Indicates if the asset is editable (true) or not (false). This permission is applicable to `document` assets except PDFs.
                      isShareable:
                        type: boolean
                        description: Indicates if the asset can be shared (`true`) or not (`false`). Defaults to `true`.
                  isProcessedUsed:
                    type: boolean
                    description: Indicates if the optimized version (`true`) or the original file (`false`) is used when downloaded. Defaults to `true`.
                  isSpeakerNotesEnabled:
                    type: boolean
                    description: 'Indicates whether speaker notes are enabled for the asset (`true`) or not (`false`). When enabled, allows presenters to add and view speaker notes associated with the asset. Defaults to `false`.'
                  isDivisionShared:
                    type: boolean
                    description: |
                      Indicates whether the asset is shared across multiple Divisions (`true`) or restricted to its own Division (`false`). To enable cross-Division sharing, Division-level asset sharing must be enabled on the Division provided (`isAssetSharingEnabled`  set to true).
                  isSensitive:
                    type: boolean
                    description: 'If `true`, the asset is hidden in kiosk mode.'
