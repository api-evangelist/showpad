    post:
      operationId: postAssetFiles
      summary: Create an Asset File
      description: |-
        This endpoint attaches a new binary file to an existing asset. Use this endpoint when you need to:
        - Add a new file to an existing asset
        - Replace or update the binary content while keeping metadata intact
        - Verify file integrity with a checksum
        - Upload large files using a temporary upload link

        Attaching a new binary file happens in two steps:

        Step 1: Request an upload link.
        - Send a `POST` request with the `assetId` in the path.
        - Optionally provide a new `fileName` or a Base64-encoded `contentMD5`` checksum for validation.
        - The response body includes:
          - `uploadMeta`: Information required to perform the upload
          - `uploadUrl`: A temporary signed link where the binary file must be uploaded
          - `suggestedContentType`: The `Content-Type` header value required for the upload

        Step 2: Upload the file.
        - Send a `PUT` request to the `uploadUrl`.
        - Use the `suggestedContentType` header, and include the `Content-MD5` header if you provided a checksum.
        - If the checksum doesn’t match, you’ll get a `400` error.

        Once the file is uploaded, Showpad processes it. After processing, the uploaded file becomes the `currentFile` for the asset.
