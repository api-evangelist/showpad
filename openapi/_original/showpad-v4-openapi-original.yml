  /assets/query:
    post:
      operationId: postAssetsQuery
      summary: Query assets using ShowQL
      description: "This endpoint enables you to query your asset library using [ShowQL](https://developer.showpad.com/docs/apis/content/showql), a Showpad domain-specific language (DSL) that allows for flexible and complex filtering of assets based on metadata, tags, languages, countries, and more.\nUse this endpoint when you need to: \n- Retrieve a precise set of assets using complex filter logic\n- Search by metadata, custom fields, tags, or localized attributes\n- Page through large result sets with consistent performance using cursor-based pagination \n#### Iterating over results\nThere are two ways to paginate through the results of a ShowQL query: offset-based and cursor-based pagination. The method you choose depends on the expected number of results and performance considerations. Only one pagination strategy can be used at a time. Providing both an `offset` and a `cursor` in the same request is not supported.\n- **Offset-based pagination** - Use for fewer than 10,000 results<br /><br />To fetch the first page of results, either omit the `offset` property or set it to `0`. The `limit` property controls the maximum number of assets returned per page. If its omitted, the default value is applied.<br /><br />To fetch the next page of results, calculate the new offset by adding the number of items returned in the previous page to the current offset:<br /><br /> `offset = offset + items.length`<br /><br />Pagination should stop when the next offset value would be greater than or equal to the `count` value returned in the response.<br /><br />**Note**:<ul><li>If the number of remaining results is fewer than the `limit`, only the remaining items will be returned.</li><li>If the `offset` exceeds the number of available results, an empty `items` array will be returned.</li><li>Attempting to retrieve more than 10,000 results using offset-based pagination will result in a <strong>400 (Bad Request)</strong> response.</li></ul> \n\n- **Cursor-based pagination** - Use for more than 10,000 results<br /><br />To fetch the first page, omit the `cursor` property.<br /><br />Each response includes a `next` property containing a cursor string. To retrieve the next page, set the `cursor` property in your request to this `next` value. Continue this process until `next` is `null`, which indicates there are no more results.<br /><br />The `limit` property can be used to control the number of assets returned per page.<br /><br />Important considerations:<ul><li>**Do not change the sort order or filtering criteria** between cursor-based requests, as doing so may result in inconsistent or unexpected pagination behavior.</li><li>Cursors may become invalid if large changes occur in the underlying data between paginated requests.</li></ul>\n"
      tags:
        - assets
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  description: A valid ShowQL string to query assets.
                  type: string
                  maxLength: 20000
                cursor:
                  description: Use this value from the previous response's `next` field to paginate using cursor-based pagination.
                  type: string
                offset:
                  description: |
                    The zero-based offset of the first asset returned in the result (used with offset-based pagination). This query parameter is used together with the `limit` query parameter to paginate through assets in the result.
                  type: integer
                  minimum: 0
                  maximum: 99999
                  default: 0
                limit:
                  description: |
                    The maximum number of assets to return in one page of results. Note that the actual number of assets returned in one page might be less than this limit.
                  type: integer
                  minimum: 0
                  maximum: 100
                  default: 20
            examples:
              Simple:
                summary: 'An example using `name`, `updatedAt` and `createdAt`'
                description: |
                  This query returns all non-archived assets whose name contains “eOS” and that were updated within the last 7 days, sorted by creation date in descending order.
                value: |
                  {
                    "query": "name ~ \"eOS\" AND updatedAt >= -1w ORDER BY createdAt DESC"
                  }
              Archived:
                summary: An example using `archivedAt` and `IS (NOT) EMPTY`
                description: |
                  A query that finds all assets of type "video" with more than 500 views, and that have been archived.
                value: |
                  {
                    "query": "type = \"video\" AND views > 500 AND archivedAt IS NOT EMPTY"
                  }
              Offset:
                summary: An example using offset-based paging
                description: |
                  A simple query that is also accompanied by an `offset` property to get a page of the search result different from the first one.
                value: |
                  {
                    "query": "name ~ \"eOS\" AND likes > 5",
                    "offset": 21
                  }
              Cursor:
                summary: An example using cursor-based paging
                description: |
                  A simple query that is also accompanied by an `cursor` property to get the next page of the search result. The `limit` parameter is used to specify the number of results to return but may be omitted to use the default value.
                value: |
                  {
                    "query": "name ~ \"eOS\" AND likes > 5",
                    "limit: 10,
                    "cursor": "bm90aGluZ3Rvc2Vl"
                  }
      responses:
        '200':
          description: OK. The request was successful. Returns a list of assets that match the given ShowQL query.
          content:
            application/json:
              schema:
                description: The response to a ShowQL query for assets.
                type: object
                required:
                  - count
                  - items
                properties:
                  count:
                    description: Total number of results matching the request criteria.
                    type: integer
                    format: int32
                    example: 20
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier of the asset.
                          example: my-asset-id
                        currentFile:
                          type: object
                          nullable: true
                          properties:
                            id:
                              type: string
                              description: Unique identifier of the object.
                              example: my-asset-file-id
                        name:
                          type: string
                          description: Name of the asset.
                          example: my-asset.png
                        division:
                          description: Information about the Division the asset belongs to. Cannot be changed after creation.
                          type: object
                          properties:
                            id:
                              type: string
                              description: Unique identifier of the Division.
                              example: f541710283954a89bdfd40f221882451
                        status:
                          type: string
                          description: |
                            Current processing state of the asset:
                            * `prepared` - The asset is prepared and waiting for the binary file to be uploaded.
                            * `queued` - The asset is currently queued for processing.
                            * `processing` - The asset is currently being processed.
                            * `active` - The asset is done processing and can be used.
                            * `failed` - The asset encountered an error while processing.
                          enum:
                            - prepared
                            - queued
                            - processing
                            - active
                            - failed
                        type:
                          type: string
                          description: |
                            The type of the asset.
                          enum:
                            - 3d-model
                            - audio
                            - document
                            - page
                            - personal-video-recording
                            - photo
                            - raw
                            - scorm
                            - unknown
                            - url
                            - video
                            - webapp
                        slug:
                          type: string
                          description: URL-friendly identifier of the asset.
                        externalId:
                          type: string
                          description: A custom external reference ID for the asset. Only editable when the application owns the asset and the user has `manage_content` permissions for the Division.
                          nullable: true
                          example: my-custom-id
                          minLength: 1
                          maxLength: 128
                        description:
                          type: string
                          description: A description of the asset.
                          nullable: true
                        createdAt:
                          type: string
                          format: date-time
                          nullable: true
                          description: 'Timestamp when the asset was created, in `ISO 8601` UTC format.'
                        updatedAt:
                          type: string
                          format: date-time
                          nullable: true
                          description: 'Timestamp when the asset was last updated, in `ISO 8601` UTC format.'
                        expiresAt:
                          type: string
                          format: date-time
                          description: 'Optional expiration date of the asset, in `ISO 8601` UTC format.'
                          nullable: true
                        releasedAt:
