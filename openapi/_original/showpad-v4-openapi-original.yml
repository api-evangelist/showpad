      schema:
        type: string
        example: ab4756bbdeytifj334tppqef
    divisionIdsQueryParam:
      name: divisionIds
      in: query
      description: One or multiple division IDs to filter on.
      explode: false
      style: form
      example:
        - division-id-1
        - division-id-2
      schema:
        type: array
        items:
          type: string
    limitQueryParam:
      name: limit
      in: query
      description: 'A limit on the number of objects to be returned, between `0` and `1000`.'
      schema:
        type: integer
        format: int32
        default: 50
        minimum: 0
        maximum: 1000
    offsetQueryParam:
      name: offset
      in: query
      description: 'Offset of the returned result, to be used in combination with `limit`.'
      required: false
      schema:
        type: integer
        format: int32
        default: 0
        minimum: 0
