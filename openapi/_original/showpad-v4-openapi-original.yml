    put:
      operationId: update-recommendation-rule
      summary: Updates a recommendation rule
      description: |-
        Use this endpoint to update an existing recommendation rule by its unique ID. Updating a rule allows you to change its conditions, operators, tag logic, or recommended items so that content suggestions remain accurate and aligned with evolving CRM workflows.

        This is useful when you need to:
        - Modify rule conditions based on updated CRM fields or business logic
        - Adjust tag requirements to refine which assets are recommended
        - Update recommended items as content changes over time
