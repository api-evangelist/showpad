  '/themes/{themeId}':
    get:
      operationId: theme-get
      summary: Get a Theme
      description: |-
        Retrieves the full configuration, color settings, visual assets, and metadata for a specific theme.

        This endpoint allows you to:
        - Fetch localized branding components for a specific business unit.
        - Verify active color configurations before rendering custom UI elements.
        - Access asset URLs for logos and cover images.
      tags:
        - themes
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 'The request was successful. Returns the detailed configuration, color properties, and asset metadata for the specified theme.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - title
                  - isGlobal
                  - isDefault
                  - displayData
                  - colorSettings
                  - createdAt
                  - updatedAt
                  - division
                properties:
                  id:
                    type: string
                    description: The unique identifier of the theme.
                  title:
                    type: string
                    description: The display name of the theme.
                  isGlobal:
                    type: boolean
                    description: Indicates whether the theme is a Global Theme. A Global Theme is available to all users across all Divisions.
                  isDefault:
                    type: boolean
                    description: 'Controls whether the theme is set as the default option within its designated Division. The default theme is automatically assigned to all experiences in that Division. A Global Theme cannot be marked as default, meaning this value remains false for global entities. Only one theme can be configured as the default per Division.'
                  displayData:
                    type: object
                    required:
                      - aboutDescription
                      - logo
                      - displayImage
                    properties:
                      aboutDescription:
                        type: string
                        maxLength: 800
                        description: 'The descriptive text displayed within the Shared Content Viewer. This property does not apply to Shared Spaces, which lack an about section.'
                      logo:
                        type:
                          - object
                          - 'null'
                        required:
                          - url
                        properties:
                          url:
                            type: string
                      displayImage:
                        type:
                          - object
                          - 'null'
                        required:
