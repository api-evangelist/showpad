    post:
      operationId: postAssetFiles
      summary: Create an Asset File
      description: "This endpoint attaches a new binary file to an existing asset. Use this endpoint when you need to:\n- Add a new file to an existing asset\n- Replace or update the binary content while keeping metadata intact\n- Verify file integrity with a checksum\n- Upload large files using a temporary upload link\n\nAttaching a new binary file happens in two steps:\n\nStep 1: Request an upload link.\n- Send a `POST` request with the `assetId` in the path.\n- Optionally provide a new `fileName` or a Base64-encoded `contentMD5`` checksum for validation.\n- The response body includes:\n  - `uploadMeta`: Information required to perform the upload\n  - `uploadUrl`: A temporary signed link where the binary file must be uploaded\n  - `suggestedContentType`: The `Content-Type` header value required for the upload\n\nStep 2: Upload the file.\n- Send a `PUT` request to the `uploadUrl`.\n- Use the `suggestedContentType` header, and include the `Content-MD5` header if you provided a checksum.\n- If the checksum doesn’t match, you’ll get a `400` error.\n\nOnce the file is uploaded, Showpad processes it. After processing, the uploaded file becomes the `currentFile` for the asset."
      tags:
      - assets
      security:
      - BearerAuth: []
      responses:
        '201':
          description: The file was successfully created and associated with the asset. Returns the created File object.
          x-summary: Created. The resource was successfully created.
          content:
            application/json:
              schema:
                description: Created File object.
                type: object
                properties:
                  id:
                    type: string
                    description: Unique identifier of the object.
                    example: my-asset-file-id
                  name:
                    type:
                    - string
                    - 'null'
                    description: The name of the uploaded file.
                    example: video.mp4
                  status:
                    type: string
                    description: 'Current processing state of the asset:

                      * `prepared` - The asset is prepared and waiting for the binary file to be uploaded.

                      * `queued` - The asset is currently queued for processing.

                      * `processing` - The asset is currently being processed.

                      * `active` - The asset is done processing and can be used.

                      * `failed` - The asset encountered an error while processing.

                      '
                    enum:
                    - prepared
                    - queued
                    - processing
                    - active
                    - failed
                  error:
                    type:
                    - string
                    - 'null'
                    description: 'A short explanation of the issue during file processing. The value

                      will be set to `null` if there is no error.

                      '
                    example: null
                  uploadMeta:
                    type: object
                    properties:
                      uploadUrl:
                        type:
                        - string
                        - 'null'
                        description: The signed URL where the binary file must be uploaded via a `PUT` request. The URL is valid for 15 minutes.
                        format: uri
                        example: https://s3.amazonaws.com/path/to/bucket/with/signed/credentials
                      suggestedContentType:
                        type: string
                        description: The suggested `Content-Type` header for the upload request to `uploadUrl`.
                        example: video/mp4
                      metadata:
                        type:
                        - object
                        - 'null'
                        description: Additional metadata that must be sent with the upload request.
                        example:
                          origin: api
                        additionalProperties:
                          type: string
