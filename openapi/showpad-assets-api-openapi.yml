    servers:
    - url: https://{subdomain}.api.showpad.com/v4
      description: Production server
      x-environment: production
      variables:
        subdomain:
          default: customer
          description: Showpad customer subdomain
  /assets/query:
    post:
      operationId: postAssetsQuery
      summary: Query assets using ShowQL
      description: "This endpoint enables you to query your asset library using [ShowQL](https://developer.showpad.com/docs/apis/content/showql), a Showpad domain-specific language (DSL) that allows for flexible and complex filtering of assets based on metadata, tags, languages, countries, and more.\nUse this endpoint when you need to: \n- Retrieve a precise set of assets using complex filter logic\n- Search by metadata, custom fields, tags, or localized attributes\n- Page through large result sets with consistent performance using cursor-based pagination \n#### Iterating over results\nThere are two ways to paginate through the results of a ShowQL query: offset-based and cursor-based pagination. The method you choose depends on the expected number of results and performance considerations. Only one pagination strategy can be used at a time. Providing both an `offset` and a `cursor` in the same request is not supported.\n- **Offset-based pagination** - Use for fewer than 10,000 results<br /><br />To fetch the first page of results, either omit the `offset` property or set it to `0`. The `limit` property controls the maximum number of assets returned per page. If its omitted, the default value is applied.<br /><br />To fetch the next page of results, calculate the new offset by adding the number of items returned in the previous page to the current offset:<br /><br /> `offset = offset + items.length`<br /><br />Pagination should stop when the next offset value would be greater than or equal to the `count` value returned in the response.<br /><br />**Note**:<ul><li>If the number of remaining results is fewer than the `limit`, only the remaining items will be returned.</li><li>If the `offset` exceeds the number of available results, an empty `items` array will be returned.</li><li>Attempting to retrieve more than 10,000 results using offset-based pagination will result in a <strong>400 (Bad Request)</strong> response.</li></ul> \n\n- **Cursor-based pagination** - Use for more than 10,000 results<br /><br />To fetch the first page, omit the `cursor` property.<br /><br />Each response includes a `next` property containing a cursor string. To retrieve the next page, set the `cursor` property in your request to this `next` value. Continue this process until `next` is `null`, which indicates there are no more results.<br /><br />The `limit` property can be used to control the number of assets returned per page.<br /><br />Important considerations:<ul><li>**Do not change the sort order or filtering criteria** between cursor-based requests, as doing so may result in inconsistent or unexpected pagination behavior.</li><li>Cursors may become invalid if large changes occur in the underlying data between paginated requests.</li></ul>\n"
      tags:
      - assets
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              properties:
                query:
                  description: A valid ShowQL string to query assets.
                  type: string
                  maxLength: 20000
                cursor:
                  description: Use this value from the previous response's `next` field to paginate using cursor-based pagination.
                  type: string
                offset:
                  description: 'The zero-based offset of the first asset returned in the result (used with offset-based pagination). This query parameter is used together with the `limit` query parameter to paginate through assets in the result.

                    '
                  type: integer
                  minimum: 0
                  maximum: 99999
                  default: 0
                limit:
                  description: 'The maximum number of assets to return in one page of results. Note that the actual number of assets returned in one page might be less than this limit.

                    '
                  type: integer
                  minimum: 0
                  maximum: 100
                  default: 20
            examples:
              Simple:
                summary: An example using `name`, `updatedAt` and `createdAt`
                description: 'This query returns all non-archived assets whose name contains “eOS” and that were updated within the last 7 days, sorted by creation date in descending order.

                  '
                value: "{\n  \"query\": \"name ~ \\\"eOS\\\" AND updatedAt >= -1w ORDER BY createdAt DESC\"\n}\n"
              Archived:
                summary: An example using `archivedAt` and `IS (NOT) EMPTY`
                description: 'A query that finds all assets of type "video" with more than 500 views, and that have been archived.

                  '
                value: "{\n  \"query\": \"type = \\\"video\\\" AND views > 500 AND archivedAt IS NOT EMPTY\"\n}\n"
              Offset:
                summary: An example using offset-based paging
