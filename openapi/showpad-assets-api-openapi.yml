    get:
      operationId: getAssetFiles
      summary: List Asset Files
      description: 'Use this endpoint to retrieve all file versions that belong to a specific asset. Asset files may include the original upload, optimized formats, or alternative versions of the same asset.


        This is useful when you need to:

        - Display all available file formats for a given asset

        - Download or preview specific asset versions

        - Inspect file-level metadata, such as size, checksum, or extension

        - Paginate through large sets of files associated with a single asset'
