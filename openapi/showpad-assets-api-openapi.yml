                                  type: object
                                  properties:
                                    id:
                                      type: string
                                      description: Unique identifier of the asset.
                                      example: my-asset-id
                            variants:
                              type: array
                              description: List of variants associated with the primary asset.
                              minItems: 0
                              maxItems: 50
                              items:
                                type: object
                                required:
                                - asset
                                - status
                                properties:
                                  asset:
                                    type: object
                                    required:
                                    - id
                                    - languages
                                    - countries
                                    - authors
                                    properties:
                                      id:
                                        type: string
                                        description: Unique identifier of the asset.
                                        example: my-asset-id
                                      languages:
                                        type: array
                                        description: List of assigned languages.
                                        items:
                                          description: The `ISO 639-1` language code identifying the supported language.
                                          type: object
                                          properties:
                                            code:
                                              type: string
