    patch:
      operationId: updateParticipantSettings
      summary: Update Participant's Settings
      description: 'Update the notification settings for the currently authenticated user within a specific Mutual Action Plan (MAP).


        Use this endpoint when you need to:

        - Enable or disable notifications for actions assigned to the current user

        - Enable or disable notifications for actions marked as completed

        - Programmatically manage notification preferences as part of a workflow or integration


        Only the settings belonging to the authenticated user can be updated. At least one setting must be provided in the request body.'
      tags:
      - mutual-action-plan
      security:
      - BearerAuth: []
      parameters:
      - schema:
          type: string
        required: true
        description: Unique identifier of the Mutual Action Plan (MAP).
        name: mapId
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                assignedActionNotifications:
                  type: boolean
                  description: Indicates whether the participant receives notifications when an action is assigned to them.
                completedActionNotifications:
                  type: boolean
                  description: Indicates whether the participant receives notifications when an action is marked as completed.
              minProperties: 1
      responses:
        '200':
          description: OK. The request was successful. Returns the updated notification settings for the currently authenticated user within the specified MAP.
          content:
            application/json:
              schema:
                type: object
                required:
