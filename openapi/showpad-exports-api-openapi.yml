openapi: 3.2.0
info:
  title: Showpad Exports API
  version: '3'
  termsOfService: https://www.showpad.com/terms-of-service
  contact:
    name: Showpad
    email: support@showpad.com
    url: https://help.showpad.com/hc/en-us/requests/new
  x-audience: external-partner
servers:
- url: https://{subdomain}.showpad.biz/api/v3/
  description: Production server
  x-environment: production
  variables:
    subdomain:
      default: customer
      description: Showpad customer subdomain
security:
- oAuth: []
- bearerAuth: []
tags:
- name: exports
  description: ''
paths:
  /exports/asset-authors.json:
    get:
      deprecated: false
      tags:
      - exports
      operationId: get_exports_asset-authors
      description: Export of asset-authors
      summary: /exports/asset-authors.json
      responses:
        default:
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                required:
                - response
                properties:
                  meta:
                    type: object
                    properties:
                      code:
                        type: integer
                        format: int32
                      message:
                        type: string
                      serverTime:
                        type: string
                        format: date-time
                      lastUpdatedTime:
                        type: string
                        format: date-time
                      requestRateLimit:
                        type: integer
                        format: int32
                      requestRateLimitReset:
                        type: integer
                        format: int32
                      requestsRemaining:
                        type: integer
                        format: int32
                      location:
                        type: string
                        format: link
                      userTimezone:
                        type: object
                        properties:
                          offset:
                            type: string
                          name:
                            type: string
                  response:
                    type: object
                    properties:
                      count:
                        description: Total number of results.
                        type: integer
                        format: int32
                        example: 20
                      items:
                        type: array
                        description: List of resources.
                        items:
                          type: object
                          required:
                          - assetId
                          - authorId
                          example:
                            assetId: a3e72bbfae0b87381106b1beb685ea88
                            authorId: aaf982e112be64774f5a5a9a1ac5d0c2
                          properties:
                            assetId:
                              description: The unique identifier of the asset.
                              type: string
                            authorId:
                              description: The unique identifier of the Showpad user that is the author of this asset.
                              type: string
      security:
      - bearerAuth: []
      - oAuth:
        - read_division_management
      parameters:
      - name: limit
        description: Sets the maximum number of returned items. The maximum limit is set to 100000. For example, if 'limit' is 1, only 1 items will be retrieved.
        required: false
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100000
      - name: offset
        description: Set the offset of the returned items.For example, if 'offset' is 5 and 'limit' is 10,  items 6 to 15 will be returned.
        required: false
        in: query
        schema:
          type: integer
          format: int32
          minimum: 0
