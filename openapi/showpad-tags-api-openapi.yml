                        example: f541710283954a89bdfd40f221882451
                  description: The ID of the Division this object will belong to. This cannot be updated once set.
                origin:
                  type: object
                  description: 'By specifying an `origin`, a client controls whether the tag will be local or external. To create an external tag, specify an `origin` object with `type` set to `oauth2client`. To create a local tag, either omit `origin` entirely or specify an `origin` object with `type` set to `local` and `id` set to `showpad`. Any other values are illegal and will result in a response with a `400` status code.

                    '
                  properties:
                    id:
                      type: string
                      enum:
                      - showpad
                      description: 'When creating a local tag, i.e. `type` is `local`, `id` must be `showpad`.

                        '
                    type:
                      type: string
                      enum:
                      - local
                      - oauth2client
                      description: 'Use `local` to make the tag local. Use `oauth2client` to make the tag external, and associate it to the OAuth2 client part of the identity making the request.

                        '
                  required:
                  - type
                  example: "{\n  \"type\": \"oauth2client\"\n}\n"
                externalServiceId:
                  type:
                  - string
                  - 'null'
                  example: Cs131Da51fage1d1488f29e74756ee60
