  /shared-spaces/{shareId}/items:
    post:
      operationId: shared-spaces-items-add
      summary: Add items to Shared Space
      description: 'Add items to Shared Space.

        You can add individual files and create folders on-the-fly.

        Supports nested structures with folders containing other items.'
      tags:
      - shared-spaces
      security:
      - BearerAuth: []
      parameters:
      - schema:
          type: string
        required: true
        name: shareId
        in: path
        description: ID of the Shared Space
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    oneOf:
                    - type: object
                      properties:
                        type:
                          type: string
                          enum:
                          - asset
                        assetId:
                          type: string
                          description: The unique identifier of the asset to add.
                        page:
                          type: integer
                          exclusiveMinimum: 0
                          example: 1
                          description: The page number of the asset, this is 1-based
                      required:
                      - type
                      - assetId
                      title: AssetItem
                    - type: object
                      properties:
                        type:
                          type: string
                          enum:
                          - folder
                        name:
                          type: string
                          example: Price Lists
                          description: The name of the folder
                        description:
                          type: string
                          description: The description of the folder
                        folderItems:
                          type: array
                          items:
                            oneOf:
                            - type: object
                              properties:
                                type:
                                  type: string
                                  enum:
                                  - asset
                                assetId:
                                  type: string
                                  description: The unique identifier of the asset to add.
                                page:
                                  type: integer
                                  exclusiveMinimum: 0
                                  example: 1
                                  description: The page number of the asset, this is 1-based
                              required:
                              - type
                              - assetId
                              title: AssetItem
                            - type: object
                              properties:
                                type:
                                  type: string
                                  enum:
                                  - folder
                                name:
                                  type: string
                                  example: Price Lists
                                  description: The name of the folder
                                description:
                                  type: string
                                  description: The description of the folder
                                folderItems:
                                  type: array
                                  items:
                                    oneOf:
                                    - type: object
                                      properties:
                                        type:
                                          type: string
                                          enum:
                                          - asset
                                        assetId:
                                          type: string
                                          description: The unique identifier of the asset to add.
                                        page:
                                          type: integer
                                          exclusiveMinimum: 0
                                          example: 1
                                          description: The page number of the asset, this is 1-based
                                      required:
                                      - type
                                      - assetId
                                      title: AssetItem
                                    - type: object
                                      properties:
                                        type:
                                          type: string
                                          enum:
                                          - folder
                                        name:
                                          type: string
                                          example: Price Lists
                                          description: The name of the folder
                                        description:
                                          type: string
                                          description: The description of the folder
                                      required:
                                      - type
                                      - name
                                      title: FolderItem
                                    discriminator:
                                      propertyName: type
                                      mapping:
                                        asset: '#/components/schemas/SharedSpace-DevPortalAssetItem'
                                        folder: '#/components/schemas/SharedSpace-FolderItemLevel3'
                              required:
                              - type
                              - name
                              title: FolderItem
                            discriminator:
                              propertyName: type
                              mapping:
                                asset: '#/components/schemas/SharedSpace-DevPortalAssetItem'
                                folder: '#/components/schemas/SharedSpace-FolderItemLevel2'
                      required:
                      - type
                      - name
                      title: FolderItem
                    discriminator:
                      propertyName: type
                      mapping:
                        asset: '#/components/schemas/SharedSpace-DevPortalAssetItem'
                        folder: '#/components/schemas/SharedSpace-FolderItemLevel1'
                    description: 'Represents an item being added to a Shared Space - either an asset (file) or a folder.

                      Folders may contain nested items of these two types (assets, folders).

                      If a folder with the same name already exists, a new folder will still be created'
              required:
              - items
              example:
                folderItemId: 9c5f3aa0784df25db1db821354e337e9
                items:
                - type: folder
                  name: Documents
                  folderItems:
                  - type: asset
                    assetId: a5f01a23f94aaf6195c1012694a404ea
                  - type: folder
                    name: Second lvl
                    folderItems:
                    - type: asset
                      assetId: a5f01a23f94aaf6195c1012694a404ea
                    - type: asset
                      assetId: a5f01a23f94aaf6195c1012694a404ea
                - type: asset
                  assetId: a5f01a23f94aaf6195c1012694a404ea
      responses:
        '201':
          description: Items were successfully added
          content:
            application/json:
              schema:
                type: object
                required:
                - summary
                - failedItems
                example:
                  summary:
                    assetSuccessCount: 7
                    assetFailureCount: 3
                  failedItems:
                  - type: asset
                    assetId: c7f03c45f96ccf8397e3134896c606gc
                    page: 2
                    reason: NON_SHAREABLE
                  - type: asset
                    assetId: d8f04d56fa7ddf9498f4245997d707hd
                    reason: INACCESSIBLE
                  - type: asset
                    assetId: e9f05e67fb8eefa599f5356a98e808ie
                    page: 1
                    reason: LOCKED_RANGE_INCOMPLETE
                  - type: asset
                    assetId: f0f06f78fc9ffb65a0f6467b99f909jf
                    reason: ASSET_NOT_FOUND
                  - type: asset
                    assetId: 01f07089fd0ffc76b1f7578c9af00akg
                    page: 3
                    reason: ONLY_ENTIRE_DOCUMENT_ALLOWED
                  - type: asset
                    assetId: 12f08190fe1ffd87c2f8689d9bf11blh
                    reason: ARCHIVED
                properties:
                  summary:
                    type: object
                    required:
                    - assetSuccessCount
                    - assetFailureCount
                    properties:
                      assetSuccessCount:
                        type: integer
                        minimum: 0
                        description: Number of assets that were successfully added.
                        example: 7
                      assetFailureCount:
                        type: integer
                        minimum: 0
                        description: Number of assets that failed to be added. Details about each failed asset, including failure reasons, are provided in the failedItems array.
                        example: 3
                  failedItems:
                    type: array
                    items:
                      oneOf:
                      - type: object
                        properties:
                          assetId:
                            type: string
                          name:
                            type: string
                          page:
                            type: integer
                            exclusiveMinimum: 0
                          type:
                            type: string
                            enum:
                            - asset
                          reason:
                            type: string
                            enum:
                            - NON_SHAREABLE
                            - INACCESSIBLE
                            - LOCKED_RANGE_INCOMPLETE
                            - ASSET_NOT_FOUND
                            - ONLY_ENTIRE_DOCUMENT_ALLOWED
