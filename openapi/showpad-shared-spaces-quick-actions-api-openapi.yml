    patch:
      operationId: update-shared-spaces-quick-action
      summary: Update a Shared Space Quick Action
      description: Update a Quick Action within a Shared Space
      tags:
      - shared-spaces-quick-actions
      security:
      - BearerAuth: []
      parameters:
      - schema:
          type: string
        required: true
        name: shareId
        in: path
        description: ID of the Shared Space
      - schema:
          type: string
        required: true
        name: quickActionId
        in: path
        description: ID of the Quick Action created for a Shared Space
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: The title of the Quick Action that will be displayed in the Shared Space
                  example: Schedule a meeting with John
                url:
                  type: string
                  description: URL to the external link/website to be embedded
                  example: https://example.com/meet-with-john
                isInternal:
                  type: boolean
                  description: '`true` to only display the Quick Action to the Seller. `false` to display the Quick Action for both Buyer and Seller. If not passed - defaulted to `false`'
                  example: true
      responses:
        '200':
          description: Shared Space Quick Action was successfully updated
