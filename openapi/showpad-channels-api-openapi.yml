        description: A comma-separated list of '&lt;resourceID&gt;; rel=&quot;ResourceType&quot;'
        required: false
        in: header
        schema:
          type: string
      - name: describe_apis
        description: Describes the different api calls available together with the allowed parameters
        required: false
