                      type:
                        description: Indicates the type of the channel (classic or template)
                        type: string
                      updatedAt:
                        description: The date that the user was updated
                        type: string
                        format: date-time
                      usergroups:
                        description: The groups linked to this channel
                        type: object
                        properties:
                          href:
                            type: string
                            format: link
                      users:
