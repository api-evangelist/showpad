  - category: parameter
    range: 2xxx
    codes:
      - {code: 2001, name: InvalidParameterError, meaning: Parameter value is invalid}
      - {code: 2002, name: NegativeParameterError, meaning: Parameter cannot be negative}
      - {code: 2003, name: NotNumericParameterError, meaning: Parameter must be a number}
      - {code: 2004, name: NotIntegerParameterError, meaning: Parameter must be an integer}
  - category: persistence
    range: 3xxx
    codes:
      - {code: 3000, name: PersistenceError, meaning: General persistence error}
      - {code: 3001, name: RelationshipDoesNotExistError, meaning: Referenced relationship doesn't exist}
      - {code: 3002, name: RelationshipExistsError, meaning: Relationship already exists}
      - {code: 3003, name: RelationshipNotFound, meaning: Relationship not found}
      - {code: 3004, name: ResourceNotFoundError, meaning: Resource with given ID doesn't exist}
      - {code: 3005, name: SubcollectionNotFoundError, meaning: Subcollection not found}
      - {code: 3006, name: UnableToDeleteError, meaning: Resource cannot be deleted}
      - {code: 3007, name: RelationshipUnsupportedError, meaning: Relationship type not supported}
      - {code: 3008, name: ResourceNotModifiableError, meaning: Resource cannot be modified}
