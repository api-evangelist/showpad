- aid: showpad:showpad-mcp-server
  name: Showpad MCP Server
  description: >-
    Hosted remote Model Context Protocol server that lets AI assistants such as Claude and Cursor search
    Showpad assets, fetch their content, run ShowQL filters, ask questions with cited sources, and read
    Shared Spaces and their engagement insights. Protected by OAuth 2.0 with PKCE and the same seven scopes
    as the REST API.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.showpad.com/docs/integrations/platform-independent/mcp
