  - aid: showpad:showpad-webhooks-api
    name: Showpad Webhooks API
    description: Create and manage webhook subscriptions and read their delivery logs. Notifications carry a CloudEvents-shaped envelope and are signed with HMAC-SHA256 over the raw body plus a timestamp, with a five-minute replay window and three retries on 5xx.
