crosswalk:
  - tool: search
    category: content
    rest:
      - postAssetsQuery
      - getAssets
    binding: rest
    confidence: high
    note: >-
      Asset search by name, type, description or content maps to the v4 assets query endpoint
      (POST /assets/query) with GET /assets as the unfiltered listing form.
  - tool: fetch
    category: content
    rest:
      - getAsset
      - getAssetFiles
      - getAssetFileById
    binding: rest
    confidence: high
    note: >-
      Retrieving an asset's content by ID fans out across the asset record and its file
      representations (text transcription / page content / URL).
  - tool: showpad_showql_filter
    category: content
    rest:
      - postAssetsQuery
    binding: rest
    confidence: high
    note: >-
      ShowQL structured metadata filtering is the query body accepted by POST /assets/query.
  - tool: showpad_whoami
    category: identity
    rest:
      - get_users_me
    binding: rest
    confidence: high
    note: >-
      v3 GET /users/me.json returns the calling user's identity. v4 exposes getUsers and
      getUserById but no self endpoint.
  - tool: showpad_shared_spaces_list
    category: shared-spaces
    rest:
