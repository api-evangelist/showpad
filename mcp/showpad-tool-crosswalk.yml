source: mcp/showpad-mcp.yml + openapi/showpad-v4-openapi-original.yml + openapi/showpad-v3-openapi-original.yml
note: >-
  The live MCP tools/list is auth-gated (HTTP 401 at https://mcp.showpad.com/mcp/v1), so tool
  input schemas could not be read. Tools are mapped to backing OpenAPI operations by name and
  documented semantics; confidence is set accordingly and nothing is asserted beyond what the
  published tool descriptions and the specs support.

