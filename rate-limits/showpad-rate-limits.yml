name: Showpad API Rate Limits
description: >-
  Showpad rate-limits its REST API but publishes no numbers. The documentation states only that
  HTTP 429 is returned when "too many requests have been sent within a specific amount of time"
  and instructs callers to "check the response headers for retry timing information" — without
  naming those headers. No X-RateLimit-*, RateLimit-* or Retry-After header is documented, and
  no window, quota or burst allowance is published for any plan.
url: https://developer.showpad.com/docs/apis/concepts/fundamentals
generated: '2026-08-14'
method: searched
source: >-
  https://developer.showpad.com/docs/apis/concepts/fundamentals,
  https://developer.showpad.com/docs/apis/concepts/error-codes
created: '2026-06-13'
modified: '2026-08-14'
limit_count: 0
limit_count_note: >-
  Zero published numeric limits. This is an honest zero: the limit exists and is enforced, but
  Showpad discloses no threshold an integrator could design against.
headers_documented: false
status_on_exhaustion: 429

rateLimits:
  - name: General API Rate Limit
    description: >-
      Applies across API v3 and v4. Exceeding the allowed request volume within an undisclosed
      window returns HTTP 429 Too Many Requests.
    scope: unspecified
    type: requests
    window: unspecified
    limit: null
    burst: null
    httpStatusOnExceed: 429
    responseHeaders: []
    remediation: Implement exponential backoff with retry logic on 429.
    source: https://developer.showpad.com/docs/apis/concepts/error-codes

token_limits:
  - name: OAuth access token lifetime
    value: 1 hour
    source: https://developer.showpad.com/docs/apis/concepts/authentication
  - name: OAuth refresh token lifetime
    value: 14 days
    source: https://developer.showpad.com/docs/apis/concepts/authentication
  - name: Personal API token lifetime
    value: configurable (optional expiry set at creation)
    source: https://developer.showpad.com/docs/apis/concepts/authentication
  - name: OAuth client refresh token lifetime
    value: configurable per OAuth client at registration
    source: https://developer.showpad.com/docs/apis/concepts/authentication

webhook_retries:
  note: Delivery retry schedule for outbound webhooks; not a request rate limit.
  max_attempts: 3
  schedule:
    - attempt: 1
      delay: 3s
    - attempt: 2
      delay: 7.5s
    - attempt: 3
      delay: 14.25s
  source: https://developer.showpad.com/docs/webhooks
