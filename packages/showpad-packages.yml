currency_note: >-
  The maintained developer-facing packages are @showpad/cli (1.0.7, 2025-04-18) and
  @showpad/experience-app-sdk (3.3.0, 2025-12-15). Both predate the v4 REST API surface
  documented in 2026, which they do not wrap — the Apps SDK and the REST API are separate
  products, so this is not by itself an abandonment signal for the REST API.
