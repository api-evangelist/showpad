note: >-
  Showpad's first-party client libraries are all published to npm under the @showpad scope.
  They target the Showpad Apps / Experience App extension platform and the CLI — Showpad
  ships no server-side REST API SDK for the v3/v4 APIs in any language. Nothing was found on
  PyPI, RubyGems, crates.io, NuGet or Maven Central; the Packagist results for "showpad" are
  third-party community clients, not Showpad-published.
