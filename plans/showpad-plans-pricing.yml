developer_entitlements:
  - capability: Test API Requests console
    required_plan: Ultimate, Advanced, or Expert
    also_requires: Administrator access to the Showpad Admin App
    source: https://developer.showpad.com/docs/apis/concepts/testing
  - capability: Webhooks (subscriptions + notifications)
    required_plan: Ultimate with Enterprise add-on, Advanced, or Expert
    source: https://developer.showpad.com/docs/webhooks
  - capability: Content Reporting event exports
    required_plan: Ultimate, Advanced, or Expert
    source: https://developer.showpad.com/docs/apis/reporting/content-reporting/event-types
