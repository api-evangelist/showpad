name: Showpad Plans and Pricing
description: >-
  Showpad publishes three named packages — Professional, Advanced and Expert — on its pricing
  page, but no prices. Every tier carries a "Request a quote" button. Licensing is per-user and
  Showpad describes packages as "fully customizable", so all commercial terms are negotiated
  with sales. Developer-facing entitlement is tier-gated: the API console, webhooks and
  Content Reporting each state a minimum plan in the developer docs.
