    source: https://developer.showpad.com/docs/appsv2/developer-tools/sdk

notes:
  - Showpad publishes no list price for any tier; every tier links to a quote request.
  - >-
    A prior round of this profile recorded Content / Coach / Complete tiers at $25 / $37 / $50
    per user per month. Those tier names and figures do not appear on Showpad's pricing page
    and could not be sourced to any Showpad-published surface, so they have been removed
    rather than carried forward.
  - >-
    Plan names in the developer documentation ("Ultimate", "Enterprise add-on") do not fully
    match the marketing page ("Professional", "Advanced", "Expert"), which suggests the
    packaging was renamed and the developer docs were not fully updated.
